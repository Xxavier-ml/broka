services:
  - type: web
    name: broka-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false          # Primary AI broker (Gemini 2.0 Flash). Enter manually in Render dashboard.
      - key: GROQ_API_KEY
        sync: false          # Fallback AI (llama-3.3-70b-versatile). Enter manually in Render dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: broka-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://your-app.codemagic.io  # Update after Codemagic deploy
      - key: TOKEN_EXPIRE_MINUTES
        value: "60"

databases:
  - name: broka-db
    plan: free
    region: oregon
