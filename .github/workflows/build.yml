name: Build Broka APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate launcher icons
        run: |
          pip install Pillow --quiet
          python3 flutter_app/android/app/src/main/res/gen_icons.py

      - name: Get packages
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --debug || true
          echo "=== Finding APK ==="
          find /home/runner/work -name "*.apk" 2>/dev/null

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broka-debug
          path: |
            flutter_app/android/app/build/outputs/apk/debug/app-debug.apk
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            flutter_app/build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
