name: Build Broka APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate launcher icons
        run: |
          pip install Pillow --quiet
          python3 flutter_app/android/app/src/main/res/gen_icons.py

      - name: Get packages
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --debug || true
          echo "=== Finding APK ==="
          find /home/runner/work -name "*.apk" 2>/dev/null

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find /home/runner/work -name "app-debug.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Delete previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --yes --repo ${{ github.repository }} 2>/dev/null || true

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-debug \
            "${{ steps.find_apk.outputs.apk_path }}" \
            --repo ${{ github.repository }} \
            --title "Broka Debug APK" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --prerelease
